name: Approve inactive learner disenrollment

on:
  workflow_dispatch:
    inputs:
      usernames:
        description: GitHub usernames to remove (separate with commas or spaces)
        required: true
        type: string
      confirmation:
        description: Type DISENROLL SELECTED to confirm only the listed learners
        required: true
        type: string

permissions:
  contents: read

jobs:
  approve:
    name: Delete selected approved unfinished courses only
    runs-on: ubuntu-latest
    environment: learner-disenrollment
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Preserve resume state and delete selected reviewed repositories
        env:
          CURRICULUM_ADMIN_TOKEN: ${{ secrets.CURRICULUM_ADMIN_TOKEN }}
          CURRICULUM_ORG: High-Q-Solid-Academy
          STUDENT_USERNAMES: ${{ inputs.usernames }}
          DISENROLL_CONFIRMATION: ${{ inputs.confirmation }}
        run: node gradebook/approve-disenrollment.mjs
