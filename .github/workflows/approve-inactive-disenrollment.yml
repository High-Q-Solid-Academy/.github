name: Approve inactive learner disenrollment

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DISENROLL SELECTED to confirm the checked learners
        required: true
        type: string

permissions:
  contents: read

jobs:
  approve:
    name: Apply checked learner disenrollments safely
    runs-on: ubuntu-latest
    environment: learner-disenrollment
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Read checked learners from private review dashboard
        id: selection
        env:
          CURRICULUM_ADMIN_TOKEN: ${{ secrets.CURRICULUM_ADMIN_TOKEN }}
          CURRICULUM_ORG: High-Q-Solid-Academy
        run: node gradebook/review-selection.mjs

      - name: Classify selected learners by repository ownership
        id: ownership
        env:
          CURRICULUM_ADMIN_TOKEN: ${{ secrets.CURRICULUM_ADMIN_TOKEN }}
          CURRICULUM_ORG: High-Q-Solid-Academy
          STUDENT_USERNAMES: ${{ steps.selection.outputs.usernames }}
        run: node gradebook/classify-disenrollment.mjs

      - name: Pause selected learner-owned enrollments
        if: steps.ownership.outputs.learner_owned != ''
        env:
          CURRICULUM_ADMIN_TOKEN: ${{ secrets.CURRICULUM_ADMIN_TOKEN }}
          CURRICULUM_ORG: High-Q-Solid-Academy
          HIGHQ_GITHUB_APP_ID: ${{ secrets.HIGHQ_GITHUB_APP_ID }}
          HIGHQ_GITHUB_APP_PRIVATE_KEY: ${{ secrets.HIGHQ_GITHUB_APP_PRIVATE_KEY }}
          HIGHQ_GITHUB_APP_SLUG: ${{ secrets.HIGHQ_GITHUB_APP_SLUG }}
          STUDENT_USERNAMES: ${{ steps.ownership.outputs.learner_owned }}
          DISENROLL_CONFIRMATION: ${{ inputs.confirmation }}
        run: node gradebook/pause-learner-owned.mjs

      - name: Preserve and remove selected academy-owned course repos
        if: steps.ownership.outputs.legacy != ''
        env:
          CURRICULUM_ADMIN_TOKEN: ${{ secrets.CURRICULUM_ADMIN_TOKEN }}
          CURRICULUM_ORG: High-Q-Solid-Academy
          STUDENT_USERNAMES: ${{ steps.ownership.outputs.legacy }}
          DISENROLL_CONFIRMATION: ${{ inputs.confirmation }}
        run: node gradebook/approve-disenrollment.mjs

      - name: Clear completed selections from private review dashboard
        if: success()
        env:
          CURRICULUM_ADMIN_TOKEN: ${{ secrets.CURRICULUM_ADMIN_TOKEN }}
          CURRICULUM_ORG: High-Q-Solid-Academy
          STUDENT_USERNAMES: ${{ steps.selection.outputs.usernames }}
          CLEAR_SELECTIONS: "1"
        run: node gradebook/review-selection.mjs
