name: Approve inactive learner disenrollment

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DISENROLL SELECTED to confirm the checked learners
        required: true
        type: string

permissions:
  contents: read

jobs:
  approve:
    name: Delete checked approved unfinished courses only
    runs-on: ubuntu-latest
    environment: learner-disenrollment
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Read checked learners from private review dashboard
        id: selection
        env:
          CURRICULUM_ADMIN_TOKEN: ${{ secrets.CURRICULUM_ADMIN_TOKEN }}
          CURRICULUM_ORG: High-Q-Solid-Academy
        run: node gradebook/review-selection.mjs

      - name: Preserve resume state and delete checked reviewed repositories
        env:
          CURRICULUM_ADMIN_TOKEN: ${{ secrets.CURRICULUM_ADMIN_TOKEN }}
          CURRICULUM_ORG: High-Q-Solid-Academy
          STUDENT_USERNAMES: ${{ steps.selection.outputs.usernames }}
          DISENROLL_CONFIRMATION: ${{ inputs.confirmation }}
        run: node gradebook/approve-disenrollment.mjs

      - name: Clear completed selections from private review dashboard
        if: success()
        env:
          CURRICULUM_ADMIN_TOKEN: ${{ secrets.CURRICULUM_ADMIN_TOKEN }}
          CURRICULUM_ORG: High-Q-Solid-Academy
          STUDENT_USERNAMES: ${{ steps.selection.outputs.usernames }}
          CLEAR_SELECTIONS: "1"
        run: node gradebook/review-selection.mjs
