name: Backfill and migrate enrollment records

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write missing records and assign legacy learners to Computer Science (leave unchecked for dry run)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  backfill:
    name: Restore enrollment records and protect legacy programme assignment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Backfill and migrate legacy learners
        env:
          CURRICULUM_ADMIN_TOKEN: ${{ secrets.CURRICULUM_ADMIN_TOKEN }}
          CURRICULUM_ORG: High-Q-Solid-Academy
          APPLY: ${{ inputs.apply }}
        run: node gradebook/backfill-enrollments.mjs
