name: Collect High Q student grades

on:
  workflow_dispatch:
  schedule:
    - cron: "15 18 * * *"

permissions:
  contents: read

jobs:
  gradebook:
    name: Build instructor gradebook
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gradebook configuration
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Collect latest student scores
        env:
          GRADEBOOK_TOKEN: ${{ secrets.GRADEBOOK_TOKEN }}
          GRADEBOOK_ORG: High-Q-Solid-Academy
          CURRICULUM_ADMIN_TOKEN: ${{ secrets.CURRICULUM_ADMIN_TOKEN }}
          CURRICULUM_ORG: High-Q-Solid-Academy
          HIGHQ_GITHUB_APP_ID: ${{ secrets.HIGHQ_GITHUB_APP_ID }}
          HIGHQ_GITHUB_APP_PRIVATE_KEY: ${{ secrets.HIGHQ_GITHUB_APP_PRIVATE_KEY }}
          HIGHQ_GITHUB_APP_SLUG: ${{ secrets.HIGHQ_GITHUB_APP_SLUG }}
        run: node gradebook/collect.mjs

      - name: Create styled printable report
        run: node gradebook/render-report.mjs

      - name: Email instructor reports when SMTP is configured
        env:
          REPORT_SMTP_HOST: ${{ secrets.REPORT_SMTP_HOST }}
          REPORT_SMTP_PORT: ${{ secrets.REPORT_SMTP_PORT }}
          REPORT_SMTP_SECURITY: ${{ secrets.REPORT_SMTP_SECURITY }}
          REPORT_SMTP_USERNAME: ${{ secrets.REPORT_SMTP_USERNAME }}
          REPORT_SMTP_PASSWORD: ${{ secrets.REPORT_SMTP_PASSWORD }}
          REPORT_EMAIL_FROM: ${{ secrets.REPORT_EMAIL_FROM }}
          REPORT_EMAIL_FROM_NAME: High Q Digital Training
          REPORT_EMAIL_RECIPIENTS: ${{ secrets.REPORT_EMAIL_RECIPIENTS }}
        run: python3 gradebook/send-report.py

      - name: Upload instructor gradebook
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: highq-instructor-gradebook
          path: |
            gradebook.csv
            gradebook.json
            gradebook.html
          retention-days: 90
