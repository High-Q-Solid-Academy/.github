name: Enroll learner in programme

on:
  workflow_dispatch:
    inputs:
      username:
        description: Learner's exact GitHub username (High Q GitHub App must already be installed on this account)
        required: true
        type: string
      real_name:
        description: Learner's full real name (must match GitHub profile Name)
        required: true
        type: string
      email:
        description: Learner's email address for High Q course notifications
        required: true
        type: string
      programme:
        description: Programme / curriculum track
        required: true
        default: computer-science
        type: choice
        options:
          - computer-science
          - computer-engineering
      enrollment_version:
        description: Repository ownership model
        required: true
        default: v2
        type: choice
        options:
          - v2
          - v1

permissions:
  contents: read

jobs:
  enroll:
    name: Provision learner-owned High Q course repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Enroll learner
        env:
          CURRICULUM_ADMIN_TOKEN: ${{ secrets.CURRICULUM_ADMIN_TOKEN }}
          CURRICULUM_ORG: High-Q-Solid-Academy
          HIGHQ_GITHUB_APP_ID: ${{ secrets.HIGHQ_GITHUB_APP_ID }}
          HIGHQ_GITHUB_APP_PRIVATE_KEY: ${{ secrets.HIGHQ_GITHUB_APP_PRIVATE_KEY }}
          HIGHQ_GITHUB_APP_SLUG: ${{ secrets.HIGHQ_GITHUB_APP_SLUG }}
          HIGHQ_PROGRESS_API_TOKEN: ${{ secrets.HIGHQ_PROGRESS_API_TOKEN }}
          STUDENT_USERNAME: ${{ inputs.username }}
          REAL_NAME: ${{ inputs.real_name }}
          STUDENT_EMAIL: ${{ inputs.email }}
          STUDENT_TRACK: ${{ inputs.programme }}
          ENROLLMENT_VERSION: ${{ inputs.enrollment_version }}
        run: node gradebook/enroll-student.mjs
