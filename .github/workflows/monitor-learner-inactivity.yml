name: Monitor learner inactivity

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/monitor-learner-inactivity.yml
      - gradebook/monitor-inactivity.mjs
      - gradebook/send-inactivity-email.py
      - gradebook/inactivity-lib.mjs
      - gradebook/managed-repositories.mjs
      - gradebook/learner-registry.mjs
      - gradebook/github-app.mjs
      - gradebook/curriculum-api.mjs
      - gradebook/courses.json
  schedule:
    - cron: "20 6 * * *"

permissions:
  contents: read

concurrency:
  group: highq-inactivity-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Review current unfinished learner courses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Warn inactive learners and flag review cases
        env:
          CURRICULUM_ADMIN_TOKEN: ${{ secrets.CURRICULUM_ADMIN_TOKEN }}
          CURRICULUM_ORG: High-Q-Solid-Academy
          HIGHQ_GITHUB_APP_ID: ${{ secrets.HIGHQ_GITHUB_APP_ID }}
          HIGHQ_GITHUB_APP_PRIVATE_KEY: ${{ secrets.HIGHQ_GITHUB_APP_PRIVATE_KEY }}
          HIGHQ_GITHUB_APP_SLUG: ${{ secrets.HIGHQ_GITHUB_APP_SLUG }}
        run: node gradebook/monitor-inactivity.mjs
      - name: Email newly warned or reviewed learners
        env:
          REPORT_SMTP_HOST: ${{ secrets.REPORT_SMTP_HOST }}
          REPORT_SMTP_PORT: ${{ secrets.REPORT_SMTP_PORT }}
          REPORT_SMTP_SECURITY: ${{ secrets.REPORT_SMTP_SECURITY }}
          REPORT_SMTP_USERNAME: ${{ secrets.REPORT_SMTP_USERNAME }}
          REPORT_SMTP_PASSWORD: ${{ secrets.REPORT_SMTP_PASSWORD }}
          REPORT_EMAIL_FROM: ${{ secrets.REPORT_EMAIL_FROM }}
          REPORT_EMAIL_FROM_NAME: High Q Solid Academy
        run: python3 gradebook/send-inactivity-email.py
