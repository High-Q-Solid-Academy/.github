name: Resume paused learner

on:
  workflow_dispatch:
    inputs:
      username:
        description: Learner's current GitHub username
        required: true
        type: string
      confirmation:
        description: Type RESUME followed by a space and the exact username
        required: true
        type: string

permissions:
  contents: read

jobs:
  resume:
    name: Restore learner at their paused course
    runs-on: ubuntu-latest
    environment: learner-disenrollment
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Recreate paused course repository
        env:
          CURRICULUM_ADMIN_TOKEN: ${{ secrets.CURRICULUM_ADMIN_TOKEN }}
          CURRICULUM_ORG: High-Q-Solid-Academy
          STUDENT_USERNAME: ${{ inputs.username }}
          RESUME_CONFIRMATION: ${{ inputs.confirmation }}
        run: node gradebook/resume-paused-learner.mjs
