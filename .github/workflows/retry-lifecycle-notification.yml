name: Retry HIGH-Q lifecycle email only

on:
  workflow_dispatch:
    inputs:
      username:
        description: GitHub username; must match a verified paused/resumed record
        required: true
        type: string
      action:
        description: Status notification to retry (not a learner-state operation)
        required: true
        type: choice
        options:
          - paused
          - resumed

permissions:
  contents: read

jobs:
  mail:
    name: Verify preserved record and notify learner without changing enrollment
    runs-on: ubuntu-latest
    environment: learner-disenrollment
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Retry status email without rerunning pause/resume
        env:
          HIGHQ_LEARN_LIFECYCLE_TOKEN: ${{ secrets.HIGHQ_LEARN_LIFECYCLE_TOKEN }}
          STUDENT_USERNAME: ${{ inputs.username }}
          LEARNER_LIFECYCLE_ACTION: ${{ inputs.action }}
        run: node gradebook/notify-website-lifecycle.mjs
